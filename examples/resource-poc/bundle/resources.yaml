apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: bundled-check
spec:
  results:
    - name: outcome
  steps:
    - name: check
      image: docker.io/library/busybox:1.36.1
      script: |
        #!/bin/sh
        set -eu
        printf 'resolved-from-bundle' > "$(results.outcome.path)"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bundled-pipeline
spec:
  params:
    - name: bundle
      type: string
  tasks:
    - name: check
      taskRef:
        resolver: bundles
        params:
          - name: bundle
            value: $(params.bundle)
          - name: name
            value: bundled-check
          - name: kind
            value: task
  results:
    - name: outcome
      value: $(tasks.check.results.outcome)
