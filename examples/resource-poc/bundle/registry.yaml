apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-poc-registry
  template:
    metadata:
      labels:
        app: resource-poc-registry
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          env:
            - name: REGISTRY_HTTP_TLS_CERTIFICATE
              value: /certs/tls.crt
            - name: REGISTRY_HTTP_TLS_KEY
              value: /certs/tls.key
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: registry-tls
---
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector:
    app: resource-poc-registry
  ports:
    - port: 5000
      targetPort: 5000
